<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — Centro de Experiência do Colaborador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/login.css">
</head>
<body class="fundo-vivo">
    <main class="login-cartao">
        <div class="selo-marca login-marca">
            <img src="/static/marca/logo-av-marca.png" alt="Alonso &amp; Verdiani">
        </div>

        <h1>Centro de Experiência</h1>
        <p class="login-subtitulo">Alonso &amp; Verdiani — entre com sua conta</p>

        {% if erro %}
        <p class="login-erro">⚠ {{ erro }}</p>
        {% endif %}

        <form action="/login" method="post">
            <div class="campo">
                <label for="usuario_login">Usuário</label>
                <input id="usuario_login" type="text" name="usuario_login" required autocomplete="username">
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input id="senha" type="password" name="senha" required autocomplete="current-password">
            </div>
            <button type="submit" class="botao-entrar">Entrar</button>
        </form>

        <p class="login-rodape">Centro de Experiência do Colaborador</p>
    </main>

    <script src="/static/login.js" defer></script>
</body>
</html>
